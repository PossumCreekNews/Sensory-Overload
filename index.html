<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111025"><title>Sensory Overload</title><style>*{box-sizing:border-box}body{margin:0;background:#101024;color:#fff;font:15px Aptos,Arial,sans-serif}header{padding:17px 18px 8px;text-align:center}h1{font-size:25px;margin:0;letter-spacing:2px}header p{color:#bbb5d5;margin:5px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}button{border:1px solid #655d8e;background:#292545;color:white;border-radius:13px;padding:12px 4px;font:inherit;cursor:pointer}button.active{background:#7547bd;border-color:#d6a4ff}.stage{position:relative;margin:0 12px;border-radius:22px;overflow:hidden;background:#17152c;border:1px solid #4b426b;height:min(65vh,620px);touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.toolbar{display:flex;justify-content:center;gap:10px;padding:12px}.toolbar button{padding:10px 18px}.hint{text-align:center;color:#d4cfe8;padding:0 14px 20px;font-size:14px}footer{text-align:center;color:#8f87ad;font-size:12px;padding:8px}</style></head><body><header><h1>✨ SENSORY OVERLOAD</h1><p>Pop it • Squish it • Slice it • Melt it • Feel it</p></header><nav id="modes"></nav><div class="stage"><canvas id="c"></canvas></div><div class="toolbar"><button id="reset">↻ Reset</button><button id="sound">🔊 Sound On</button></div><div class="hint" id="hint"></div><footer>Take a moment. Play your way.</footer><script>
const names=['🫧 Bubble Pop','🍮 Squish Lab','🔪 Sensory Slice','🌈 Liquid Touch','💥 Smash Zone','🌿 Zen Garden'];const hints=['Tap bubbles to pop them.','Press and drag the jelly blobs.','Swipe across the shapes to slice them.','Draw glowing trails with your finger.','Tap tiles to shatter them.','Drag to draw peaceful patterns in the sand.'];let mode=0,objects=[],particles=[],trails=[],drawing=false,last=null,sound=true,audio=null;const c=document.getElementById('c'),ctx=c.getContext('2d'),stage=c.parentElement;let W=0,H=0;const rand=(a,b)=>Math.random()*(b-a)+a;const colors=['#fa78bc','#83d4ff','#a98aff','#ffcf70','#8cf5b0','#f28b82'];function tone(freq=420){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(90,freq*.45),audio.currentTime+.11);g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.14)}catch(e){}}function resize(){let r=stage.getBoundingClientRect();W=c.width=Math.max(1,Math.floor(r.width*devicePixelRatio));H=c.height=Math.max(1,Math.floor(r.height*devicePixelRatio));ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=r.width;H=r.height;init()}function init(){objects=[];particles=[];trails=[];const count=mode===0?36:mode===1?7:mode===2?18:mode===4?28:0;for(let i=0;i<count;i++){let r=mode===1?rand(25,43):mode===0?rand(14,31):mode===4?rand(19,34):rand(24,45);objects.push({x:rand(r+8,Math.max(r+9,W-r-8)),y:rand(r+8,Math.max(r+9,H-r-8)),r,color:colors[i%colors.length],alive:true,wobble:0,rot:rand(0,6.28)})}document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===mode));document.getElementById('hint').textContent=hints[mode]}const nav=document.getElementById('modes');names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{mode=i;init()};nav.appendChild(b)});document.getElementById('reset').onclick=init;document.getElementById('sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 Sound On':'🔇 Sound Off'};function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function burst(x,y,color,n=14){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-4,4),vy:rand(-4,4),life:rand(20,42),color,r:rand(2,6)})}function interact(p){if(mode===3){trails.push({...p,life:65,color:colors[Math.floor(rand(0,colors.length))]});if(trails.length>280)trails.shift();return}if(mode===5){trails.push({...p,life:999,color:'#fff'});if(trails.length>1500)trails.shift();return}for(const o of objects){if(!o.alive)continue;let d=Math.hypot(p.x-o.x,p.y-o.y);if(d<o.r+(mode===2?12:0)){if(mode===1){o.x+=(p.x-o.x)*.24;o.y+=(p.y-o.y)*.24;o.wobble=1;tone(230);break}o.alive=false;burst(o.x,o.y,o.color,mode===4?24:14);tone(mode===4?140:mode===0?550:340);break}}}c.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;last=pos(e);c.setPointerCapture(e.pointerId);interact(last)});c.addEventListener('pointermove',e=>{if(!drawing)return;let p=pos(e);if(mode===2&&last){let dist=Math.hypot(p.x-last.x,p.y-last.y),steps=Math.min(30,Math.ceil(dist/7));for(let i=1;i<=steps;i++)interact({x:last.x+(p.x-last.x)*i/steps,y:last.y+(p.y-last.y)*i/steps})}else interact(p);last=p});c.addEventListener('pointerup',()=>{drawing=false;last=null});function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,mode===5?'#4c3b32':'#1b1735');bg.addColorStop(1,mode===5?'#8c6b4e':'#302052');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);if(mode===5){ctx.strokeStyle='rgba(255,232,188,.09)';for(let y=4;y<H;y+=7){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}for(const o of objects){if(!o.alive)continue;o.wobble*=.92;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.scale(1+o.wobble*.25,1-o.wobble*.18);ctx.shadowBlur=mode===0?16:10;ctx.shadowColor=o.color;ctx.fillStyle=o.color;ctx.globalAlpha=mode===0?.7:1;ctx.beginPath();if(mode===4){ctx.roundRect(-o.r,-o.r,o.r*2,o.r*2,5)}else if(mode===2){ctx.roundRect(-o.r,-o.r*.7,o.r*2,o.r*1.4,10)}else ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.38)';ctx.beginPath();ctx.ellipse(-o.r*.28,-o.r*.3,o.r*.25,o.r*.12,-.5,0,Math.PI*2);ctx.fill();ctx.restore()}for(const t of trails){if(mode===3){ctx.globalAlpha=Math.min(1,t.life/45);ctx.shadowBlur=23;ctx.shadowColor=t.color;ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y,rand(7,10),0,Math.PI*2);ctx.fill();t.life-=1}else if(mode===5){ctx.strokeStyle='rgba(40,28,20,.35)';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(t.x+.2,t.y+.2);ctx.stroke();ctx.fillStyle='rgba(255,235,185,.45)';ctx.beginPath();ctx.arc(t.x+3,t.y+3,3,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;ctx.shadowBlur=0;trails=trails.filter(t=>t.life>0);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/42);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=.11;p.life--}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(draw)}window.addEventListener('resize',resize);resize();draw();
</script></body></html>
