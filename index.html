<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0920"><title>Sensory Overload</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0920;color:white;font:11pt Aptos,Arial,sans-serif}button{font:inherit;color:white;cursor:pointer}main{max-width:720px;margin:auto;min-height:100dvh}section{display:none;min-height:100dvh;padding:22px 16px}section.active{display:flex;flex-direction:column}.hero{background:radial-gradient(circle at 50% 35%,#642da9 0,#24144e 35%,#0b0920 75%);align-items:center;justify-content:space-around;text-align:center;overflow:hidden}.orb{width:min(74vw,320px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 25% 22%,#fff9 0,transparent 12%),radial-gradient(circle at 70% 75%,#ff57cb,transparent 45%),radial-gradient(circle at 20% 70%,#19e5ff,transparent 48%),radial-gradient(circle at 65% 15%,#933dff,transparent 55%);box-shadow:0 0 50px #9c44ff,0 0 110px #13baff66,inset -18px -20px 35px #15052e;animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-18px) scale(1.025)}}h1{font-size:clamp(35px,9vw,65px);line-height:1.02;letter-spacing:2px;text-shadow:0 0 20px #ff4dc9,0 0 42px #537eff;margin:12px 0}h2{font-size:27px;margin:8px 0 20px}.tag{letter-spacing:3px;color:#cbb9ed;font-size:12px}.primary{padding:17px 30px;border-radius:99px;border:1px solid #ff9ce9;background:linear-gradient(100deg,#5421b9,#c5279e,#264ce1);box-shadow:0 0 25px #b33dff88;font-weight:bold;letter-spacing:1px}.secondary{border:1px solid #75649d;border-radius:30px;background:#241b47;padding:11px 16px}.actions{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.arcade{background:linear-gradient(#1b103b,#0b0920)}.top{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{height:190px;border:1px solid #8f5bc6;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:12px;padding:18px 8px;background:radial-gradient(circle at 50% 25%,var(--glow),#170e35 70%);box-shadow:inset 0 0 22px #ffffff15,0 8px 18px #0006}.tile .emoji{font-size:60px;filter:drop-shadow(0 0 16px var(--glow))}.tile b{font-size:17px;text-shadow:0 2px 12px #000}.play{background:#100d28}.play .top{margin-bottom:12px}.stage{flex:1;min-height:55vh;border-radius:23px;overflow:hidden;position:relative;border:1px solid #6651a4;touch-action:none;background:#191332}canvas{width:100%;height:100%;display:block;touch-action:none}.hint{color:#d3c9ed;text-align:center;min-height:42px;padding:10px}.bottom{display:flex;justify-content:center;gap:12px;padding:8px}.bottom button{min-width:110px}@media(max-width:360px){.tile{height:150px}.tile .emoji{font-size:45px}}</style></head>
<body><main><section class="hero active" id="welcome"><div><div class="tag">THE ULTIMATE SENSORY EXPERIENCE</div><h1>SENSORY<br>OVERLOAD</h1></div><div class="orb"></div><div><button class="primary" id="enter">ENTER EXPERIENCE</button><p><button class="secondary sound">🔊 SOUND ON</button></p></div></section>
<section class="arcade" id="arcade"><div class="top"><button class="secondary" id="home">⌂ Home</button><button class="secondary sound">🔊 SOUND ON</button></div><h2>Choose your sensation</h2><div class="cards" id="cards"></div><p class="tag" style="text-align:center;margin-top:25px">SIX WORLDS. ENDLESS SATISFACTION.</p></section>
<section class="play" id="play"><div class="top"><button class="secondary" id="back">← Games</button><button class="secondary sound">🔊 SOUND ON</button></div><h2 id="gameTitle"></h2><div class="stage"><canvas id="canvas"></canvas></div><div class="hint" id="hint"></div><div class="bottom"><button class="secondary" id="reset">↻ Reset</button><button class="secondary" id="next">Next game →</button></div></section></main>
<script>
(function(){'use strict';
const games=[['Bubble Pop','🫧','#126c9b','Tap to pop shimmering bubbles'],['Squish Lab','🍮','#9a248d','Press and drag to stretch jelly'],['Sensory Slice','🔪','#b85b26','Swipe through colorful layers'],['Liquid Touch','🌈','#194dc7','Paint with glowing liquid'],['Smash Zone','💎','#6736c4','Tap crystals to shatter them'],['Zen Garden','🌿','#72623e','Draw peaceful patterns in sand']];
let current=0,sound=true,ctxAudio=null,items=[],bits=[],strokes=[],down=false,previous=null,W=300,H=500;
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),rand=(a,b)=>a+Math.random()*(b-a),palette=['#ff75db','#7cdeff','#a38aff','#ffca74','#81f2b6'];
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===id));if(id==='play')setTimeout(resize,50)}
function toggleSound(){sound=!sound;document.querySelectorAll('.sound').forEach(b=>b.textContent=sound?'🔊 SOUND ON':'🔇 SOUND OFF')}
document.querySelectorAll('.sound').forEach(b=>b.onclick=toggleSound);$('enter').onclick=()=>show('arcade');$('home').onclick=()=>show('welcome');$('back').onclick=()=>show('arcade');$('reset').onclick=init;$('next').onclick=()=>openGame((current+1)%6);
games.forEach((g,i)=>{const b=document.createElement('button');b.className='tile';b.style.setProperty('--glow',g[2]);b.innerHTML='<span class="emoji">'+g[1]+'</span><b>'+g[0]+'</b>';b.onclick=()=>openGame(i);$('cards').appendChild(b)});
function tone(f){if(!sound)return;try{ctxAudio=ctxAudio||new(window.AudioContext||window.webkitAudioContext)();const o=ctxAudio.createOscillator(),v=ctxAudio.createGain();o.type='sine';o.frequency.setValueAtTime(f,ctxAudio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(80,f/2),ctxAudio.currentTime+.13);v.gain.setValueAtTime(.055,ctxAudio.currentTime);v.gain.exponentialRampToValueAtTime(.001,ctxAudio.currentTime+.15);o.connect(v);v.connect(ctxAudio.destination);o.start();o.stop(ctxAudio.currentTime+.15)}catch(e){}}
function openGame(i){current=i;$('gameTitle').textContent=games[i][1]+' '+games[i][0];$('hint').textContent=games[i][3];show('play')}
function resize(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;const d=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;init()}
function init(){items=[];bits=[];strokes=[];let count=[30,6,18,0,25,0][current];for(let i=0;i<count;i++){let r=current===1?rand(29,43):current===2?rand(24,39):rand(15,29);items.push({x:rand(r+6,Math.max(r+7,W-r-6)),y:rand(r+6,Math.max(r+7,H-r-6)),r,col:palette[i%5],alive:true,w:0,rot:rand(0,6.28)})}}
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function burst(x,y,col,n){for(let j=0;j<n;j++)bits.push({x,y,vx:rand(-5,5),vy:rand(-5,5),life:rand(20,40),col,r:rand(2,6)})}
function hit(p){if(current===3||current===5){strokes.push({x:p.x,y:p.y,col:palette[Math.floor(rand(0,5))],life:current===3?70:999});if(strokes.length>1400)strokes.shift();return}for(const o of items){if(!o.alive||Math.hypot(p.x-o.x,p.y-o.y)>o.r+8)continue;if(current===1){o.x+=(p.x-o.x)*.35;o.y+=(p.y-o.y)*.35;o.w=1;tone(210);break}o.alive=false;burst(o.x,o.y,o.col,current===4?26:16);tone(current===0?610:current===4?150:340);break}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();down=true;previous=point(e);canvas.setPointerCapture(e.pointerId);hit(previous)});canvas.addEventListener('pointermove',e=>{if(!down)return;const p=point(e),dx=p.x-previous.x,dy=p.y-previous.y,n=Math.min(35,Math.max(1,Math.ceil(Math.hypot(dx,dy)/7)));for(let j=1;j<=n;j++)hit({x:previous.x+dx*j/n,y:previous.y+dy*j/n});previous=p});canvas.addEventListener('pointerup',()=>{down=false;previous=null});canvas.addEventListener('pointercancel',()=>{down=false;previous=null});
function render(){if(!ctx)return;ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,current===5?'#796447':'#171332');bg.addColorStop(1,current===5?'#c2a77b':'#392158');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);if(current===5){ctx.strokeStyle='#ffffff12';for(let y=4;y<H;y+=8){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
for(const o of items){if(!o.alive)continue;o.w*=.91;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(current===4?o.rot:0);ctx.scale(1+o.w*.28,1-o.w*.2);ctx.shadowColor=o.col;ctx.shadowBlur=20;ctx.fillStyle=o.col;ctx.globalAlpha=current===0?.78:1;ctx.beginPath();if(current===4){ctx.moveTo(0,-o.r);ctx.lineTo(o.r*.85,0);ctx.lineTo(0,o.r);ctx.lineTo(-o.r*.85,0);ctx.closePath()}else if(current===2){ctx.roundRect(-o.r,-o.r*.7,o.r*2,o.r*1.4,7)}else ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff88';ctx.beginPath();ctx.ellipse(-o.r*.28,-o.r*.28,o.r*.25,o.r*.1,-.5,0,Math.PI*2);ctx.fill();ctx.restore()}
for(const s of strokes){if(current===3){ctx.globalAlpha=Math.min(1,s.life/40);ctx.shadowBlur=24;ctx.shadowColor=s.col;ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(s.x,s.y,8,0,Math.PI*2);ctx.fill();s.life--}else if(current===5){ctx.fillStyle='#4b352b88';ctx.beginPath();ctx.arc(s.x,s.y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f8ddb477';ctx.beginPath();ctx.arc(s.x+3,s.y+3,2.5,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;ctx.shadowBlur=0;strokes=strokes.filter(s=>s.life>0);
for(const p of bits){ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.life--}ctx.globalAlpha=1;bits=bits.filter(p=>p.life>0);requestAnimationFrame(render)}
window.addEventListener('resize',()=>{if($('play').classList.contains('active'))resize()});requestAnimationFrame(render);
})();
</script></body></html>
